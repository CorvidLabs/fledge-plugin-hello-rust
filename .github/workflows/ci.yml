name: CI

on:
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - benches/**
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/ci.yml
  pull_request:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - benches/**
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/ci.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test
